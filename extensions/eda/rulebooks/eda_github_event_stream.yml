---
- name: GitHub Event Stream Demo
  hosts: all

  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    - name: GitHub push received on main
      condition: >
        event.body.ref == "refs/heads/main"

      action:
        run_job_template:
          name: EDA-Triggered-Job
          organization: Network-Automation-Lab
          job_args:
            extra_vars:
              github_ref: "{{ event.body.ref }}"
              github_repository: "{{ event.body.repository.full_name }}"
