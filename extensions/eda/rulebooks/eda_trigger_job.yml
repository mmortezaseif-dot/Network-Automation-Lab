---
- name: EDA trigger controller job demo
  hosts: all

  sources:
    - name: Generate test events
      eda.builtin.range:
        limit: 5
        delay: 5

  rules:
    - name: Launch controller job on event two
      condition: event.i == 2
      action:
        run_job_template:
          name: EDA-Triggered-Job
          organization: Network-Automation-Lab
