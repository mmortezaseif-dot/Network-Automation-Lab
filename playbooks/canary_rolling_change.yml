---
# ---------------------------------------------------------
# PLAY 1 - CANARY
# ---------------------------------------------------------
- name: Canary network change
  hosts: canary_routers
  gather_facts: false
  connection: local

  serial: 1
  any_errors_fatal: true

  vars:
    funnel_host: "desktop-evg076p.tailec178b.ts.net"
    target_interface: "Loopback300"
    target_description: "AAP-CANARY-ROLLOUT"

  tasks:

    - name: Validate required host variables
      ansible.builtin.assert:
        that:
          - funnel_port is defined
          - local_relay_port is defined
        fail_msg: "Required connectivity variables are missing."

    - name: Execute canary change
      block:

        - name: Start TLS relay
          ansible.builtin.shell: |
            rm -f /tmp/socat-{{ inventory_hostname }}.pid

            nohup /usr/bin/socat \
              TCP4-LISTEN:{{ local_relay_port }},bind=127.0.0.1,reuseaddr,fork \
              OPENSSL:{{ funnel_host }}:{{ funnel_port }},verify=1,snihost={{ funnel_host }} \
              >/tmp/socat-{{ inventory_hostname }}.log 2>&1 &

            echo $! >/tmp/socat-{{ inventory_hostname }}.pid
            sleep 2
          args:
            executable: /bin/bash
          changed_when: false

        - name: Apply and verify canary configuration
          ansible.netcommon.telnet:
            host: 127.0.0.1
            port: "{{ local_relay_port }}"

            user: "{{ lookup('ansible.builtin.env', 'CISCO_USER') }}"
            password: "{{ lookup('ansible.builtin.env', 'CISCO_PASSWORD') }}"

            login_prompt: "Username: "
            password_prompt: "Password: "
            send_newline: true
            crlf: true
            pause: 1
            timeout: 60

            prompts:
              - "[>#]"

            command:
              - terminal length 0
              - configure terminal
              - "interface {{ target_interface }}"
              - "description {{ target_description }}"
              - no shutdown
              - end
              - "show running-config interface {{ target_interface }}"

          register: canary_result
          changed_when: true

        - name: Verify canary state
          ansible.builtin.assert:
            that:
              - target_interface in canary_result.stdout
              - target_description in canary_result.stdout
              - "'% Invalid input' not in canary_result.stdout"

            success_msg: >-
              CANARY PASSED on {{ inventory_hostname }}

            fail_msg: >-
              CANARY FAILED on {{ inventory_hostname }}.
              Production rollout must stop.

      always:

        - name: Stop TLS relay
          ansible.builtin.shell: |
            if [ -f /tmp/socat-{{ inventory_hostname }}.pid ]; then
              kill "$(cat /tmp/socat-{{ inventory_hostname }}.pid)" 2>/dev/null || true
              rm -f /tmp/socat-{{ inventory_hostname }}.pid
            fi
          changed_when: false


# ---------------------------------------------------------
# PLAY 2 - PRODUCTION ROLLOUT
# ---------------------------------------------------------
- name: Rolling network change
  hosts: rollout_routers
  gather_facts: false
  connection: local

  serial: 1
  max_fail_percentage: 0

  vars:
    funnel_host: "desktop-evg076p.tailec178b.ts.net"
    target_interface: "Loopback300"
    target_description: "AAP-CANARY-ROLLOUT"

  tasks:

    - name: Execute rolling change
      block:

        - name: Start TLS relay
          ansible.builtin.shell: |
            rm -f /tmp/socat-{{ inventory_hostname }}.pid

            nohup /usr/bin/socat \
              TCP4-LISTEN:{{ local_relay_port }},bind=127.0.0.1,reuseaddr,fork \
              OPENSSL:{{ funnel_host }}:{{ funnel_port }},verify=1,snihost={{ funnel_host }} \
              >/tmp/socat-{{ inventory_hostname }}.log 2>&1 &

            echo $! >/tmp/socat-{{ inventory_hostname }}.pid
            sleep 2
          args:
            executable: /bin/bash
          changed_when: false

        - name: Apply and verify configuration
          ansible.netcommon.telnet:
            host: 127.0.0.1
            port: "{{ local_relay_port }}"

            user: "{{ lookup('ansible.builtin.env', 'CISCO_USER') }}"
            password: "{{ lookup('ansible.builtin.env', 'CISCO_PASSWORD') }}"

            login_prompt: "Username: "
            password_prompt: "Password: "
            send_newline: true
            crlf: true
            pause: 1
            timeout: 60

            prompts:
              - "[>#]"

            command:
              - terminal length 0
              - configure terminal
              - "interface {{ target_interface }}"
              - "description {{ target_description }}"
              - no shutdown
              - end
              - "show running-config interface {{ target_interface }}"

          register: rollout_result
          changed_when: true

        - name: Validate device
          ansible.builtin.assert:
            that:
              - target_interface in rollout_result.stdout
              - target_description in rollout_result.stdout
              - "'% Invalid input' not in rollout_result.stdout"

            success_msg: >-
              ROLLOUT PASSED on {{ inventory_hostname }}

            fail_msg: >-
              ROLLOUT FAILED on {{ inventory_hostname }}

      always:

        - name: Stop TLS relay
          ansible.builtin.shell: |
            if [ -f /tmp/socat-{{ inventory_hostname }}.pid ]; then
              kill "$(cat /tmp/socat-{{ inventory_hostname }}.pid)" 2>/dev/null || true
              rm -f /tmp/socat-{{ inventory_hostname }}.pid
            fi
          changed_when: false
