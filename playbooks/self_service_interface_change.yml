---
- name: Self-service Cisco interface change
  hosts: localhost
  gather_facts: false

  vars:
    funnel_host: "desktop-evg076p.tailec178b.ts.net"
    funnel_port: 10000
    local_relay_port: 10001

    allowed_interfaces:
      - Loopback100
      - Loopback200
      - Loopback300

  tasks:

    - name: Validate user request
      ansible.builtin.assert:
        that:
          - change_ticket is match('^CHG-[0-9]{4,10}$')
          - target_interface in allowed_interfaces
          - target_description is match('^[A-Za-z0-9._:/ -]{3,64}$')
        fail_msg: "Change request rejected: invalid ticket, interface, or description."
        success_msg: "Change request passed input validation."

    - name: Cisco self-service change
      block:

        - name: Start temporary TLS relay
          ansible.builtin.shell: |
            rm -f /tmp/aap-socat.log /tmp/aap-socat.pid

            nohup /usr/bin/socat \
              TCP4-LISTEN:{{ local_relay_port }},bind=127.0.0.1,reuseaddr,fork \
              OPENSSL:{{ funnel_host }}:{{ funnel_port }},verify=1,snihost={{ funnel_host }} \
              >/tmp/aap-socat.log 2>&1 &

            echo $! >/tmp/aap-socat.pid
            sleep 2
          args:
            executable: /bin/bash
          changed_when: false

        - name: Apply requested interface description
          ansible.netcommon.telnet:
            host: 127.0.0.1
            port: "{{ local_relay_port }}"

            user: "{{ lookup('ansible.builtin.env', 'CISCO_USER') }}"
            password: "{{ lookup('ansible.builtin.env', 'CISCO_PASSWORD') }}"

            login_prompt: "Username: "
            password_prompt: "Password: "

            send_newline: true
            crlf: true
            pause: 1
            timeout: 60

            prompts:
              - "[>#]"

            command:
              - terminal length 0
              - configure terminal
              - "interface {{ target_interface }}"
              - "description {{ target_description }}"
              - no shutdown
              - end
              - "show running-config interface {{ target_interface }}"

          register: change_output
          changed_when: true

        - name: Verify requested change
          ansible.builtin.assert:
            that:
              - change_output.stdout is search('interface\\s+' ~ target_interface)
              - change_output.stdout is search('description\\s+' ~ target_description)
            success_msg: >-
              {{ change_ticket }} completed successfully:
              {{ target_interface }} = {{ target_description }}
            fail_msg: >-
              {{ change_ticket }} failed validation after configuration.

        - name: Show result
          ansible.builtin.debug:
            msg: "{{ change_output.stdout.splitlines() }}"

      always:

        - name: Stop temporary relay
          ansible.builtin.shell: |
            if [ -f /tmp/aap-socat.pid ]; then
              kill "$(cat /tmp/aap-socat.pid)" 2>/dev/null || true
              rm -f /tmp/aap-socat.pid
            fi
          changed_when: false
