---
- name: Backup Cisco R1 before change
  hosts: localhost
  gather_facts: false

  vars:
    funnel_host: "desktop-evg076p.tailec178b.ts.net"
    funnel_port: 10000
    local_relay_port: 10001

  tasks:
    - name: Backup workflow
      block:

        - name: Start temporary TCP to TLS relay
          ansible.builtin.shell: |
            rm -f /tmp/aap-socat.log /tmp/aap-socat.pid

            nohup /usr/bin/socat \
              TCP4-LISTEN:{{ local_relay_port }},bind=127.0.0.1,reuseaddr,fork \
              OPENSSL:{{ funnel_host }}:{{ funnel_port }},verify=1,snihost={{ funnel_host }} \
              >/tmp/aap-socat.log 2>&1 &

            echo $! >/tmp/aap-socat.pid
            sleep 2
          args:
            executable: /bin/bash
          changed_when: false

        - name: Collect current Cisco configuration
          ansible.netcommon.telnet:
            host: 127.0.0.1
            port: "{{ local_relay_port }}"

            user: "{{ lookup('ansible.builtin.env', 'CISCO_USER') }}"
            password: "{{ lookup('ansible.builtin.env', 'CISCO_PASSWORD') }}"

            login_prompt: "Username: "
            password_prompt: "Password: "

            send_newline: true
            crlf: true
            pause: 1
            timeout: 60

            prompts:
              - "[>#]"

            command:
              - terminal length 0
              - show running-config
              - show ip interface brief

          register: backup_result
          changed_when: false

        - name: Show backup in job output
          ansible.builtin.debug:
            msg: "{{ backup_result.stdout.splitlines() }}"

        - name: Publish backup information to workflow
          ansible.builtin.set_stats:
            data:
              net_backup_stdout: "{{ backup_result.stdout }}"
              net_backup_completed: true
            per_host: false

      always:

        - name: Stop temporary relay
          ansible.builtin.shell: |
            if [ -f /tmp/aap-socat.pid ]; then
              kill "$(cat /tmp/aap-socat.pid)" 2>/dev/null || true
              rm -f /tmp/aap-socat.pid
            fi
          changed_when: false
