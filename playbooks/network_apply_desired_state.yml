---
- name: Apply desired Cisco configuration
  hosts: cisco_routers
  gather_facts: false
  connection: local
  serial: 1

  vars_files:
    - ../data/device_config_data.yml

  tasks:

    - name: Verify desired-state data exists
      ansible.builtin.assert:
        that:
          - inventory_hostname in devices

        fail_msg: >-
          {{ inventory_hostname }} has no desired-state data

    - name: Select current device data
      ansible.builtin.set_fact:
        device: "{{ devices[inventory_hostname] }}"

    - name: Initialize configuration command list
      ansible.builtin.set_fact:
        config_commands:
          - terminal length 0
          - configure terminal

    - name: Build desired interface commands
      ansible.builtin.set_fact:
        config_commands: >-
          {{
            config_commands
            +
            [
              'interface Loopback' ~ item.id,
              'description ' ~ item.description,
              'ip address ' ~ item.ip_address ~ ' ' ~ item.subnet_mask,
              'no shutdown',
              'exit'
            ]
          }}
      loop: "{{ device.loopbacks }}"

    - name: Finish configuration command list
      ansible.builtin.set_fact:
        config_commands: "{{ config_commands + ['end'] }}"

    - name: Apply desired state
      block:

        - name: Start GNS3 transport
          ansible.builtin.include_role:
            name: gns3_console_transport
            tasks_from: start

        - name: Apply Cisco configuration
          ansible.netcommon.telnet:
            host: 127.0.0.1
            port: "{{ local_relay_port }}"
            user: "{{ lookup('ansible.builtin.env', 'CISCO_USER') }}"
            password: "{{ lookup('ansible.builtin.env', 'CISCO_PASSWORD') }}"
            login_prompt: "Username: "
            password_prompt: "Password: "
            send_newline: true
            crlf: true
            pause: 1
            timeout: 120
            prompts:
              - "[>#]"
            command: "{{ config_commands }}"
          register: apply_result
          changed_when: true

        - name: Report configuration submission
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }}:
              DESIRED CONFIGURATION SUBMITTED ✅

      always:

        - name: Stop GNS3 transport
          ansible.builtin.include_role:
            name: gns3_console_transport
            tasks_from: stop
