---
- name: Manage Cisco interface description
  block:

    - name: Start reusable transport
      ansible.builtin.include_role:
        name: gns3_console_transport
        tasks_from: start

    - name: Apply and verify interface configuration in one console session
      ansible.netcommon.telnet:
        host: 127.0.0.1
        port: "{{ local_relay_port }}"

        user: "{{ lookup('ansible.builtin.env', 'CISCO_USER') }}"
        password: "{{ lookup('ansible.builtin.env', 'CISCO_PASSWORD') }}"

        login_prompt: "Username: "
        password_prompt: "Password: "

        send_newline: true
        crlf: true
        pause: 1
        timeout: 60

        prompts:
          - "{{ cisco_prompt_regex }}"

        command: >-
          {{
            [
              'terminal length 0',
              'show running-config interface ' ~ target_interface,
              'configure terminal',
              'interface ' ~ target_interface,
              'description ' ~ target_description,
              'no shutdown',
              'end',
              'show running-config interface ' ~ target_interface
            ]
            +
            (['write memory'] if save_config else [])
          }}

      register: interface_session

    - name: Normalize Cisco output
      ansible.builtin.set_fact:
        normalized_output: >-
          {{
            interface_session.stdout
            | regex_replace('\r', '')
            | regex_replace('\x08', '')
          }}
      changed_when: false

    - name: Determine whether configuration was already present
      ansible.builtin.set_fact:
        interface_was_compliant: >-
          {{
            target_description
            in normalized_output.split('configure terminal')[0]
          }}
      changed_when: false

    - name: Verify final device state
      ansible.builtin.assert:
        that:
          - target_interface in normalized_output
          - target_description in normalized_output
          - "'% Invalid input' not in normalized_output"

        success_msg: >-
          {{ inventory_hostname }}: CONFIGURATION VERIFIED ✅

        fail_msg: >-
          {{ inventory_hostname }}: VALIDATION FAILED ❌

    - name: Report final result
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          {{
            'ALREADY COMPLIANT ✅'
            if interface_was_compliant
            else
            'CHANGED AND VERIFIED ✅'
          }}

  always:

    - name: Stop reusable transport
      ansible.builtin.include_role:
        name: gns3_console_transport
        tasks_from: stop
